function flag(s){const code=String(s.region||'').toLowerCase();return /^[a-z]{2}$/.test(code)?`<img class="flag" src="${e(window.CFSM_ASSETS?.['flags/'+code+'.svg']||'/flags/'+code+'.svg')}" alt="${e(code.toUpperCase())}">`:`<span class="region-fallback">${e(code.slice(0,3).toUpperCase()||'—')}</span>`;}
function osImage(s){const os=String(s.os||'').toLowerCase(),name=os.includes('ubuntu')?'os-ubuntu.svg':os.includes('debian')?'os-debian.svg':os.includes('alpine')?'os-alpine.webp':os.includes('windows')?'os-windows.svg':'os-unknown.svg';return `<img class="os-icon" src="${e(window.CFSM_ASSETS?.['os-icons/'+name]||'/os-icons/'+name)}" alt="${e(s.os||'未知系统')}" title="${e(s.os||'未知系统')}">`;}
function serverCard(s){const online=isOnline(s),ram=percent(s.ram_used,s.ram_total),disk=percent(s.disk_used,s.disk_total),cpu=validNumber(s.cpu)?num(s.cpu):null,load=String(s.load_avg??'').trim().split(/\s+/)[0],days=expiry(s),monthly=utcMonthlyTraffic(s),showMonthly=state.sysConfig.show_tf!==false;const val=p=>online&&p!==null?p.toFixed(1)+'%':'—';return `<article class="server-card" data-online="${online}" aria-label="${e(s.name)}"><header class="card-head"><div class="server-identity">${flag(s)}<h3 class="server-name">${e(s.name||'未命名节点')}</h3></div><div class="card-head-actions"><span class="online-pill ${online?'':'offline'}"><span class="dot"></span>${online?'在线 '+uptime(s):'离线 '+ageLabel(s.last_updated)}</span>${osImage(s)}<button class="card-menu" data-detail="${e(s.id)}" aria-label="查看 ${e(s.name)} 详情" title="节点详情">${icon('more',17)}</button></div></header><div class="metric-panel">${meter('CPU',online?cpu:null,'cpu',val(cpu))}${meter('内存',online?ram:null,'ram',val(ram))}${meter('存储',online?disk:null,'disk',val(disk))}${meter('负载',online?num(load)/Math.max(1,num(s.cpu_cores,1))*100:null,'load',online&&validNumber(load)?num(load).toFixed(2):'—')}</div><div class="transfer-panel"><div class="transfer-col"><span class="transfer-title">实时网速</span>${dataRow(online?s.net_out_speed:null,'up',true)}${dataRow(online?s.net_in_speed:null,'down',true)}</div><div class="transfer-col" title="${e(monthly.eligible?'UTC 本月上传 / 下载':monthly.reason)}"><span class="transfer-title">${showMonthly?'本月 · UTC':'流量隐藏'}</span>${dataRow(showMonthly?monthly.tx:null,'out',false)}${dataRow(showMonthly?monthly.rx:null,'',false)}</div><div class="transfer-col">${state.sysConfig.show_expire!==false?`<div class="expire-line">${days===null?'到期未设置':days<0?`已到期 <strong>${Math.abs(days)}</strong>天`:`剩余 <strong>${days}</strong>天`}</div><div class="expire-caption">${days!==null?e(s.expire_date):'未配置计费信息'}</div>`:'<div class="expire-line">运行 ${e(uptime(s))}</div><div class="expire-caption">'+e(s.cpu_cores??'—')+' 核处理器</div>'}</div><div class="transfer-col"><div class="connection-count"><span>TCP</span><strong>${online?e(s.tcp_conn??'—'):'—'}</strong></div><div class="connection-count"><span>UDP</span><strong>${online?e(s.udp_conn??'—'):'—'}</strong></div></div></div>${state.sysConfig.show_tf!==false?trafficPanel(s):''}${online?networkPanel(s):`<div class="offline-explanation">${icon('offline',22)}<strong>节点暂时离线</strong>最后上报 ${e(ageLabel(s.last_updated))}前 · 已保留累计流量<br>实时资源与网络质量暂停显示</div>`}<footer class="card-footer"><div class="node-tags"><span class="small-tag">${icon('globe',10)}${e(s.server_group||s.region||'未分组')}</span>${String(s.tags||'').split(',').map(t=>t.trim()).filter(Boolean).slice(0,2).map(t=>`<span class="small-tag">${e(t)}</span>`).join('')}</div><button class="detail-button" data-detail="${e(s.id)}">数据详情 ${icon('arrow',11)}</button></footer></article>`;}
function ageLabel(t){const ts=timestamp(t);if(ts===null)return'未知';const sec=Math.max(0,Math.floor((Date.now()-ts)/1000));return sec<60?sec+'秒':sec<3600?Math.floor(sec/60)+'分钟':sec<86400?Math.floor(sec/3600)+'小时':Math.floor(sec/86400)+'天';}
function timeLabel(t){const ts=timestamp(t);return ts===null?'未知':new Date(ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'UTC'});}
function renderNodes(){const servers=visibleServers();renderSummary(servers);renderMonthlySummary();$('#server-grid').innerHTML=servers.length?servers.map(serverCard).join(''):'<div class="empty-state"><h3>暂无匹配的节点</h3><p>调整分组、状态或搜索条件后重试。</p></div>';$('#result-count').textContent=`显示 ${servers.length} / ${state.servers.length} 个节点${demo?' · 示例记录':''}`;}
function renderDetail(s){if(!s)return;const panel=$('#detail-panel'),wasHidden=$('#modal-layer').hidden,activeId=document.activeElement?.id;$('#modal-layer').hidden=false;$('.shell').inert=true;document.body.style.overflow='hidden';const cached=detailCache.get(String(s.id)),snap=Array.isArray(s.ping)?s:cached||s,keys=probeKeys(s);const ping=Array.isArray(snap.ping)?snap.ping:[],loss=Array.isArray(snap.loss)?snap.loss:[],times=[...new Set([...ping,...loss].map(p=>p.ts))].sort((a,b)=>num(a)-num(b));const ram=percent(s.ram_used,s.ram_total),dsk=percent(s.disk_used,s.disk_total);panel.innerHTML=`<div class="modal-header"><h2 id="detail-title">${e(s.name||'节点详情')}</h2><button id="close-detail" type="button" class="icon-button" data-close aria-label="关闭详情">${icon('close',18)}</button></div><p class="modal-subtitle">${e(s.os||'系统未知')} · ${e(s.arch||'—')} · ${e(s.cpu_cores??'—')} 核 · ${demo?'演示记录':'探针数据'}${isOnline(s)?'':' · 当前离线，以下为最后一次上报'}</p><dl class="detail-summary"><div class="detail-item"><dt>CPU 使用率</dt><dd>${validNumber(s.cpu)?num(s.cpu).toFixed(1)+'%':'—'}</dd></div><div class="detail-item"><dt>内存${ram===null?'':' · '+ram.toFixed(1)+'%'}</dt><dd>${formatBytes(validNumber(s.ram_used)?num(s.ram_used)*1024**2:null)} <small>/ ${formatBytes(validNumber(s.ram_total)?num(s.ram_total)*1024**2:null)}</small></dd></div><div class="detail-item"><dt>存储${dsk===null?'':' · '+dsk.toFixed(1)+'%'}</dt><dd>${formatBytes(validNumber(s.disk_used)?num(s.disk_used)*1024**2:null)} <small>/ ${formatBytes(validNumber(s.disk_total)?num(s.disk_total)*1024**2:null)}</small></dd></div><div class="detail-item"><dt>下载 / 上传</dt><dd>${formatBytes(s.net_in_speed)}<small>/s · ${formatBytes(s.net_out_speed)}/s</small></dd></div><div class="detail-item"><dt>TCP / UDP 连接</dt><dd>${e(s.tcp_conn??'—')} <small>/ ${e(s.udp_conn??'—')}</small></dd></div><div class="detail-item"><dt>系统负载 · 1 / 5 / 15 分钟</dt><dd>${e(s.load_avg||'—')}</dd></div></dl><div class="detail-meta"><p>处理器 <strong>${e(s.cpu_info||'未上报')}</strong></p><p>运行时间 <strong>${e(uptime(s))}</strong></p><p>最近上报 <strong>${e(ageLabel(s.last_updated))}前</strong></p><p>配额口径 <strong>${e(traffic(s).label)}</strong></p></div>${state.sysConfig.show_tf!==false?monthlyDetail(s):''}<h3 class="detail-section-title">当前网络探测</h3><div class="table-scroll" tabindex="0" aria-label="当前网络探测数据表"><table><thead><tr><th>线路</th><th>延迟 ms</th><th>丢包 %</th></tr></thead><tbody>${keys.length?keys.map(k=>`<tr><td>${e(probeName(k,state.config))}</td><td>${e(probe(s['ping_'+k],'ms'))}</td><td>${e(probe(s['loss_'+k],'%'))}</td></tr>`).join(''):'<tr><td colspan="3">暂无探测数据</td></tr>'}</tbody></table></div>${times.length?`<h3 class="detail-section-title" style="margin-top:20px">${demo?'示例采样记录':'列表采样快照'}</h3><div class="table-scroll" tabindex="0" aria-label="网络采样数据表"><table><thead><tr><th>采样时间 UTC</th>${keys.map(k=>`<th>${e(probeName(k,state.config))} ms / %</th>`).join('')}</tr></thead><tbody>${times.map(ts=>{const p=ping.find(v=>v.ts===ts),l=loss.find(v=>v.ts===ts);return `<tr><td>${e(timeLabel(ts))}</td>${keys.map(k=>`<td>${e(probe(p?.[k],'ms'))} / ${e(probe(l?.[k],'%'))}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>`:''}<p class="detail-section-note">${demo?'所有数值均为示例。流量采用 UTC 自然月，路由仅用于排版，不含测速数据。':'当前读数由详情接口提供；列表采样快照不会伪造或补齐缺失点，不随详情推送生成历史。原生后台仍由默认主题接管。'}</p>`;if(wasHidden)$('#close-detail').focus();else if(activeId){const active=document.getElementById(activeId);if(active&&panel.contains(active))active.focus();}}
function closeDetail(){const hadDetail=modalId!==null;hideDetail();const target=demo?'#overview':'#/';if(location.hash!==target)location.hash=target;if(!demo&&hadDetail)client?.setDetail(null).catch(()=>showNotice('列表恢复失败，请刷新页面重试。',true));}
function hideDetail(){modalId=null;$('#modal-layer').hidden=true;$('.shell').inert=false;document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus();else $('#server-search').focus();returnFocus=null;}
function routeId(){try{const prefix=demo?'#node-':'#/server/';return location.hash.startsWith(prefix)?decodeURIComponent(location.hash.slice(prefix.length)):null}catch{return null}}
async function onRoute(initial=false){const id=routeId();if(id){modalId=id;if(demo){const s=state.servers.find(s=>String(s.id)===id);if(s)renderDetail(s);else{toast('示例节点不存在');closeDetail()}}else{if(!initial)await client.setDetail(id);if(state.selectedServer&&String(state.selectedServer.id)===id)renderDetail(state.selectedServer);else if(lastStatus.kind==='connecting')showNotice('正在读取节点详情…')}}else{const hadDetail=modalId!==null;hideDetail();if(!demo&&!initial&&hadDetail)await client.setDetail(null);}}
function acceptState(next){state={...next,config:next.config||{},sysConfig:next.sysConfig||{},servers:Array.isArray(next.servers)?next.servers:[]};if(!modalId&&!routeId())overviewServers=state.servers;else if(overviewServers&&state.selectedServer)overviewServers=overviewServers.map(s=>String(s.id)===String(state.selectedServer.id)?{...s,...state.selectedServer}:s);$('#site-title').textContent=state.config.site_title||'Iceglass Monitor';document.title=demo?'Iceglass Monitor':state.config.site_title||'Iceglass Monitor';$('#powered').title=state.config.version?'Workers '+state.config.version:'';if(!themeUser&&!demo&&['auto','dark','light'].includes(state.config.preferred_theme))setTheme(state.config.preferred_theme);renderGroups();renderNodes();if(modalId&&state.selectedServer&&String(state.selectedServer.id)===modalId)renderDetail(state.selectedServer);}
function acceptStatus(value){lastStatus=value;$('#connection').dataset.kind=value.kind;$('#connection-text').textContent=value.message||({live:'实时连接',polling:'定时刷新',paused:'连接已暂停',connecting:'正在连接',error:'连接异常'}[value.kind]||'等待数据');if(value.kind==='paused')showNotice(value.message||'连接已暂停，请选择是否继续');else if(value.kind==='live'||value.kind==='polling')showNotice('');}
async function loadDemo(){acceptState(createDemoState());acceptStatus({kind:'demo',message:'演示模式 · 未连接后端'});if(modalId){const s=state.servers.find(s=>String(s.id)===modalId);if(s)renderDetail(s);}}
shell();
window.addEventListener('hashchange',()=>{onRoute().catch(()=>showNotice('无法读取节点详情，请返回列表后重试。',true))});
if(demo){await loadDemo();await onRoute(true)}else{client=createMonitorClient({onState:acceptState,onStatus:acceptStatus,onError:error=>showNotice(error.message||'监控数据加载失败，请检查后端与访问权限。',true,error.needsAuth||error.needsTurnstile)});modalId=routeId();await client.start();await onRoute(true);}
window.addEventListener('pagehide',()=>client?.stop(),{once:true});

function renderMonthlySummary(){
 const note=$('#monthly-note'),month=$('#overview-month');if(state.sysConfig.show_tf===false){note.hidden=true;month.hidden=true;return}note.hidden=false;month.hidden=false;
 const all=overviewServers||[],totals=aggregateMonthlyTraffic(all);
 month.textContent=totals.period.key+' · UTC 自然月';
 note.textContent=totals.totalNodes===0?'UTC 月度统计等待服务器列表加载。':totals.complete?'月度统计按全部 '+totals.totalNodes+' 台可见节点计算，包含离线节点；不受下方筛选影响。':'已统计 '+totals.knownNodes+' / '+totals.totalNodes+' 台；其余 '+totals.missingNodes+' 台的 UTC 自然月口径无法确认，已排除。';
 note.className='overview-footnote'+(totals.complete?'':' monthly-warning');
}

function monthlyDetail(s){
 const m=utcMonthlyTraffic(s);
 return '<section class="detail-monthly"><h3 class="detail-section-title">UTC 本月流量 · '+e(m.period.key)+'</h3><dl class="detail-summary">'+[['本月总量 · 双向',m.total],['本月下载',m.rx],['本月上传',m.tx]].map(([label,value])=>'<div class="detail-item"><dt>'+label+'</dt><dd>'+formatBytes(value,2)+'</dd></div>').join('')+'</dl><p class="detail-section-note '+(m.eligible?'':'monthly-warning')+'">'+e(m.eligible?m.period.startLabel+' 至 '+m.period.endLabel+' UTC；按探针有效上报累计，不使用开机总计数。':m.reason+'。需将探针重置日配置为 1 号；历史缺口不能由主题追补。')+'</p></section>';
}

</script>
